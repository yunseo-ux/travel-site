<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Create your ELBOD2i account." />
        <title>Sign Up | ELBOD2i</title>
        <link rel="icon" href="images/logo-mark.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="css/reset.css" />
        <link rel="stylesheet" href="css/main.css" />
    </head>
    <body>

        <div id="wrap">
            <aside class="visual-panel" aria-label="ELBOD2i">
                <button class="menu-button" type="button" aria-label="Open menu">
                    <span class="menu-icon" aria-hidden="true">
                        <img src="images/menu-icon.svg" alt="" />
                    </span>
                    <span>Menu</span>
                </button>

                <a class="brand" href="#" aria-label="ELBOD2i home">
                    <img src="images/logo-mark.svg" alt="" />
                    <span>ELBOD2i</span>
                </a>

                <ul class="social-list" aria-label="Social media">
                    <li>
                        <a href="#" aria-label="Facebook">
                            <img src="images/facebook.svg" alt="" />
                        </a>
                    </li>
                    <li>
                        <a href="#" aria-label="Instagram">
                            <img src="images/instagram.svg" alt="" />
                        </a>
                    </li>
                    <li>
                        <a href="#" aria-label="Twitter">
                            <img src="images/twitter.svg" alt="" />
                        </a>
                    </li>
                </ul>
            </aside>

            <main id="content" class="content-panel">
                <form class="signup-form" action="#" method="post">
                    <div class="form-heading">
                        <h1>Sign Up</h1>
                        <p>Please fill your information below</p>
                    </div>

                    <div class="fields">
                        <label class="field">
                            <span>Name</span>
                            <span class="input-wrap">
                                <img src="images/user.svg" alt="" />
                                <input type="text" name="name" value="abc" autocomplete="name" />
                            </span>
                        </label>

                        <label class="field">
                            <span>Mobile number</span>
                            <span class="input-wrap">
                                <img src="images/phone.svg" alt="" />
                                <input type="tel" name="mobile" value="(91) 8767564357" autocomplete="tel" />
                            </span>
                        </label>

                        <label class="field">
                            <span>Email</span>
                            <span class="input-wrap">
                                <img src="images/mail.svg" alt="" />
                                <input type="email" name="email" value="abc@gmail.com" autocomplete="email" />
                            </span>
                        </label>
                    </div>

                    <div class="form-actions">
                        <button class="next-button" type="submit">
                            <span>Next</span>
                            <span class="next-icon" aria-hidden="true">
                                <img src="images/chevron-right.svg" alt="" />
                            </span>
                        </button>

                        <div class="login-row">
                            <span>Already have an account</span>
                            <a href="#">Login to your account</a>
                        </div>
                    </div>
                </form>
            </main>
        </div>
    </body>
</html>
